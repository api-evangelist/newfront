aid: newfront
name: Newfront
description: 'Newfront is a modern business insurance brokerage and technology company
  headquartered in San Francisco. It combines a traditional insurance brokerage (commercial
  business insurance, employee benefits, retirement services, and risk management) with
  a software platform that gives clients transparent data and analytics to understand
  and lower their total cost of risk. Formed from the merger of Newfront and ABD Insurance,
  the company serves technology, venture-backed, and enterprise clients across property
  and casualty, health and benefits, and personal lines. Backed by Index Ventures, Susa
  Ventures, and SV Angel. As of this enrichment pass Newfront exposes a client-facing web
  application (app.newfront.com) but publishes no public developer API, developer portal,
  or machine-readable API specification.'
